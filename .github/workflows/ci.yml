name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest entry must match `compiler` in typst.toml.
        typst: ["0.13.0", "0.15.1"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: ${{ matrix.typst }}

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      # The plugin must only import the two typst_env functions; anything else (WASI,
      # wasm-bindgen glue) would fail to load in Typst.
      - name: Build plugin
        run: |
          make wasm
          wasm-dis qrisp.wasm | grep '(import' | tee imports.txt
          test "$(grep -vc typst_env imports.txt)" = "0"

      - name: Tests
        run: make test-plugin test-e2e

      # -B because a fresh checkout leaves docs/ looking up to date.
      - name: Examples compile
        run: make -B examples

      - name: Install script works
        env:
          TYPST_PACKAGE_PATH: ${{ runner.temp }}/packages
        run: |
          ./install.sh
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' typst.toml | head -n 1)"
          printf '#import "@local/qrisp:%s": qr-code\n#qr-code("ok")\n' "$version" > "$RUNNER_TEMP/t.typ"
          typst compile "$RUNNER_TEMP/t.typ" "$RUNNER_TEMP/t.pdf"
